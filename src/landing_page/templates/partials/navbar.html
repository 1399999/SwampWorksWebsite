{% load static %}
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <a href="{% url 'landing_page:index' %}" class="navbar-brand fw-bolder lh-1">
            SwampWorks
            <small class="d-block text-primary text-uppercase fw-semibold" style="font-size: 0.55rem; letter-spacing: 0.1em;">Coding Club</small>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-lg-4 me-auto">
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'index' or request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'landing_page:about' %}">About Us</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'projects' %}active{% endif %}" href="{% url 'landing_page:projects' %}">Projects</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'ideas' %}active{% endif %}" href="{% url 'landing_page:ideas' %}">Project Ideas</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'landing_page:contact' %}">Contact</a></li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:admin_login' %}" class="nav-link">Admin</a>
                    <a href="{% url 'accounts:logout' %}" class="nav-link">Log Out</a>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="nav-link">Log In</a>
                {% endif %}
                {% if not user.is_authenticated %}
                    <a href="{% url 'accounts:register' %}" class="btn btn-primary text-uppercase fw-semibold">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
