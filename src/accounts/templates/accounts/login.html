{% extends 'accounts/base.html' %}
{% load static %}

{% block title %}Login{% endblock title %}

{% block form %}
    <form action="{% url 'accounts:login' %}" method="post">
        {% csrf_token %}

        <h1 class="h2 mb-4">Log In</h1>

        {% if message %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endif %}
        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" name="username" id="username" class="form-control">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" name="password" id="password" class="form-control">
        </div>

        <input type="submit" value="Log In" class="btn btn-primary w-100 text-uppercase">

        <p class="mt-4 mb-0 text-secondary">
            Don't have an account? <a href="{% url 'accounts:register' %}" class="fw-bold">Register here.</a>
        </p>
    </form>
{% endblock %}
