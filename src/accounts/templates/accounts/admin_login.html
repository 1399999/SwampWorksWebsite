{% extends 'accounts/base.html' %}
{% load static %}

{% block title %}Admin Login{% endblock title %}

{% block form %}
    <form action="{% url 'accounts:admin_login' %}" method="post">
        {% csrf_token %}

        <h1 class="h2 mb-4">Admin Login</h1>

        {% if message %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endif %}

        <div class="mb-3">
            <label for="passkey" class="form-label fw-semibold">Passkey</label>
            <input type="password" name="passkey" id="passkey" class="form-control">
        </div>

        <input type="submit" value="Log In as Admin" class="btn btn-primary w-100 text-uppercase">
    </form>
{% endblock %}
