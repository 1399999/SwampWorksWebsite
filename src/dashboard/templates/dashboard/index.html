{% extends 'dashboard/base.html' %}
{% load static %}


{% block content %}

<header class="bg-light border-bottom py-5">
    <div class="container py-4">
        <span class="d-block mb-3 text-primary text-uppercase small fw-semibold">Dashboard</span>
        <h1 class="display-3">Hi there, {{ request.user }}.</h1>
        <p class="lead text-secondary mb-0">Welcome to the dashboard.</p>
    </div>
</header>

<main class="container py-5">
    <div class="alert alert-warning">Note: this page is login restricted and can only be accessed by logged in users.</div>
    <p>To log out, click <a href="{% url 'accounts:logout' %}">here</a>.</p>
</main>

{% endblock content %}
